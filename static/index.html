<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>러닝플로우 | 더 먹어도 될까?</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="logo" href="/">러닝플로우</a><span id="connection" class="pill"></span></header>
<main>
  <h1>이 약, 더 먹어도 될까?</h1>
  <p class="lead">오늘 먹은 약과 새로 먹을 약을 찍으면 성분 하루 합계와 주의 사항을 알려 드려요. 참고용이며 복용 허가가 아니에요.</p>
  <label class="check consent"><input id="consent" type="checkbox"> 약 사진을 Upstage로 보내 분석하는 데 동의해요</label>

  <section class="card">
    <div class="cardhead"><h2><span class="step">1</span>오늘 이미 먹은 약</h2><button class="ghost" data-shoot="taken">＋ 약 찍기</button></div>
    <div id="list-taken" class="list"></div>
  </section>

  <section class="card">
    <div class="cardhead"><h2><span class="step">2</span>새로 먹으려는 약</h2><button class="ghost" data-shoot="new">＋ 약 찍기</button></div>
    <div id="list-new" class="list"></div>
  </section>

  <section class="card">
    <h2><span class="step">3</span>판정</h2>
    <button id="judge" class="primary wide" disabled>더 먹어도 되는지 확인</button>
    <div id="verdict"></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>

<dialog id="sheet">
  <div class="sheethead"><h2 id="sheetTitle">약 찍기</h2><button id="sheetClose" class="link" aria-label="닫기">✕</button></div>

  <div id="stageCamera">
    <div class="viewer"><video id="video" autoplay playsinline muted></video><img id="preview" alt="찍은 약 사진" hidden></div>
    <p id="cameraNote" class="hint"></p>
    <div class="row">
      <button id="shutter" class="primary wide">촬영</button>
      <button id="retake" class="ghost" hidden>다시 찍기</button>
      <button id="analyze" class="primary" hidden>이 사진으로 분석</button>
    </div>
    <label class="filepick">카메라가 안 되면 <u>사진 파일 선택</u><input id="file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden></label>
  </div>

  <div id="stageWait" hidden><div class="spinner"></div><p>사진에서 약 정보를 읽고 공식 정보와 맞춰 보는 중이에요…<br><small>보통 수십 초, 길면 몇 분 걸려요.</small></p></div>

  <div id="stageResult" hidden>
    <div class="recog"><img id="thumb" alt=""><div><small>사진에서 읽은 내용</small><strong id="recogName"></strong><span id="recogIngr"></span></div></div>
    <div id="pickedBox"></div>
    <div id="otherBox" hidden>
      <p class="hint" id="autoReason"></p>
      <form id="searchForm" class="row"><input id="query" maxlength="150" placeholder="제품명으로 다시 검색"><button>검색</button></form>
      <div id="candidates"></div>
      <div class="row center"><button id="prev" class="ghost" hidden>‹ 이전</button><button id="next" class="ghost" hidden>다음 ›</button></div>
    </div>
  </div>
  <p id="sheetStatus" class="hint danger" role="alert"></p>
</dialog>
<canvas id="canvas" hidden></canvas>
<script src="/app.js"></script></body></html>
